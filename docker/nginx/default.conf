server {
    listen 80;
    server_name _;
    client_max_body_size 22M;

    root /var/www/frontend;

    # Symfony: API, technical back-office, debug toolbar, EasyAdmin assets
    location ~ ^/(api|admin|_wdt|_profiler|bundles)(/|$) {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/backend/public;
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Uploaded media (CSV files are stored outside public/ and never served directly)
    location /uploads/ {
        root /var/www/backend/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        return 404;
    }

    include /etc/nginx/conf.d/frontend.inc;
}

# Evently — GitLab CI (scm.univ-tours.fr)
stages:
  - check
  - build

backend:
  stage: check
  image: php:8.4-cli-alpine
  services:
    - name: mysql:8.4
      alias: db
  variables:
    MYSQL_DATABASE: evently
    MYSQL_USER: evently
    MYSQL_PASSWORD: evently-ci
    MYSQL_ROOT_PASSWORD: evently-ci-root
    DATABASE_URL: "mysql://root:evently-ci-root@db:3306/evently?serverVersion=8.4&charset=utf8mb4"
  before_script:
    - apk add --no-cache git unzip icu-dev libzip-dev
    - docker-php-ext-install pdo_mysql intl zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd backend
    - composer install --no-interaction --no-progress
  script:
    - composer lint
    - composer test
  cache:
    key: backend-vendor
    paths:
      - backend/vendor/

frontend:
  stage: check
  image: node:24-alpine
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - npm run format:check
    - npm run lint
    - npm run typecheck
    - npm test
  cache:
    key: frontend-node-modules
    paths:
      - frontend/node_modules/

frontend-build:
  stage: build
  image: node:24-alpine
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

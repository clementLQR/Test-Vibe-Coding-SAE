# Evently — development environment
# Usage: docker compose up -d   (phpMyAdmin: docker compose --profile tools up -d)
name: evently

services:
  web:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/frontend.dev.inc:/etc/nginx/conf.d/frontend.inc:ro
      - ./docker/nginx/security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - ./backend/public:/var/www/backend/public:ro
      - uploads:/var/www/backend/public/uploads:ro
    depends_on:
      - php
      - node

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-dev
    volumes:
      - ./backend:/var/www/backend
      - backend-var:/var/www/backend/var
      - backend-vendor:/var/www/backend/vendor
      - uploads:/var/www/backend/public/uploads
      - datasets:/var/www/backend/var/datasets
    environment:
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?serverVersion=8.4&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy

  node:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    profiles: [tools]
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db-data:
  backend-var:
  backend-vendor:
  uploads:
  datasets:
  node_modules:

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # See docs/architecture.md §3. Every logged-in user is at least a subscriber.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_EDITOR, ROLE_DESIGNER, ROLE_DATA_PROVIDER]
        ROLE_EDITOR: [ROLE_AUTHOR]
        ROLE_AUTHOR: [ROLE_SUBSCRIBER]
        ROLE_DESIGNER: [ROLE_SUBSCRIBER]
        ROLE_DATA_PROVIDER: [ROLE_SUBSCRIBER]

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            entry_point: App\Security\AuthenticationEntryPoint
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\Security\JsonLoginSuccessHandler
                failure_handler: App\Security\JsonLoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: api_logout

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

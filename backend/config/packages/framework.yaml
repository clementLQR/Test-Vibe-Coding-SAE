framework:
    secret: '%env(APP_SECRET)%'

    session:
        cookie_samesite: lax
        cookie_secure: auto
        cookie_httponly: true

    enabled_locales: ['fr', 'en']
    set_locale_from_accept_language: true
    set_content_language_from_locale: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
